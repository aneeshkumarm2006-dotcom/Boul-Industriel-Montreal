    <script>
      (function () {
        var TL_ = window.TL;
        var H = TL_.hosts.plan;
        var T = function (abs) { return abs - H.start; };
        var tl = gsap.timeline({ paused: true });
        var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
        function segLen(el) {
          var x1 = +el.getAttribute("x1"), y1 = +el.getAttribute("y1"), x2 = +el.getAttribute("x2"), y2 = +el.getAttribute("y2");
          return Math.hypot(x2 - x1, y2 - y1);
        }
        /* Local times (seconds after the wipe starts). The choreography starts under the wipe so the seam reveals a scene already drawing itself. */

        /* --- heading (job: name the action) --- */
        tl.set("#s2-h", { opacity: 1 }, 0.1);
        tl.fromTo("#s2-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo("#s2-h", { yPercent: 150 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0.1);

        /* --- the plan draws in the site's own drafting language (job: proof of scale, 24 units in one building) --- */
        /* dash pattern = L on, L+4 off, start offset L+2: nothing (not even a square cap) is visible before the draw begins */
        var lines = $$("#pl-svg .pl-draw");
        lines.forEach(function (el) { var L = segLen(el); el.style.strokeDasharray = L + " " + (L + 4); });
        var hide = function (i, el) { return segLen(el) + 2; };
        var walls = $$("#pl-walls .pl-draw");
        var parts = $$("#pl-partitions .pl-draw");
        var dims = $$("#pl-dim-len .pl-draw, #pl-dim-dep .pl-draw");
        tl.fromTo(dims, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut", stagger: 0.05 }, 0.15);
        tl.fromTo("#pl-dim-len .pl-dimline line:not(.pl-draw), #pl-dim-dep .pl-dimline line:not(.pl-draw), .pl-dimbox, .pl-dimtext", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
        tl.fromTo("#pl-boulevard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
        tl.fromTo(walls, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.4, ease: "power3.inOut", stagger: { amount: 0.8 } }, 0.15);
        tl.fromTo(parts, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.35, ease: "power3.inOut", stagger: { amount: 0.6 } }, 0.35);
        tl.fromTo(".pl-door", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: { amount: 0.4 } }, 0.55);

        /* unit codes (including the five that will light: their "off" state) fade in with the drawing, then hold; the light-up tweens below never render early */
        tl.fromTo("#pl-labels .pl-code", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: { amount: 0.5 } }, 0.7);

        /* --- five units light on the eighth notes of bar 4 (job: which five, the mint "for sale" callback) --- */
        var order = ["12660", "12658", "12656", "12696", "12700"];
        order.forEach(function (id, i) {
          var t = T(TL_.ev["plan.hit" + (i + 1)]);
          tl.fromTo("#pl-fill-" + id, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo("#pl-off-" + id, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo("#pl-on-" + id, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.05);
          tl.fromTo("#s2-p" + (i + 1), { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, t);
        });
        tl.fromTo(".pl-saleoutline", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(TL_.ev["plan.hit1"]));
        tl.fromTo("#s2-legend", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(TL_.ev["plan.hit1"]) - 0.2);

        /* --- ambient: the plan breathes 1.2 % through the hold so nothing freezes --- */
        tl.fromTo("#s2-plan-wrap", { scale: 1 }, { scale: 1.012, duration: H.dur - 0.6, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0.3);

        window.__timelines["s2-plan"] = tl;
      })();
