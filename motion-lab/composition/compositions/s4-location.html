    <script>
      (function () {
        var TL_ = window.TL;
        var H = TL_.hosts.location;
        var T = function (abs) { return abs - H.start; };
        var tl = gsap.timeline({ paused: true });

        /* --- camera: a 7 % push toward the building, never above native pixels (source 2048 px shown at <= 1.0x) --- */
        var S0 = 0.9375, S1 = 1.003, PX = 789, PY = 655, FX = 740, FY = 527;
        tl.fromTo("#s4-cam",
          { x: FX - PX * S0, y: FY - PY * S0, scale: S0 },
          { x: FX - PX * S1, y: FY - PY * S1, scale: S1, duration: H.dur, ease: "sine.inOut" }, 0);

        /* --- headline (job: the message of the scene). Starts as the wipe bar passes, so the right half is never an empty photo. --- */
        ["#s4-h1", "#s4-h2"].forEach(function (id, i) {
          tl.set(id, { opacity: 1 }, T(18.5 + i * 0.1));
          tl.fromTo(id, { yPercent: 150 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, T(18.5 + i * 0.1));
        });
        tl.fromTo("#s4-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(18.42));

        /* --- origin pin on the building the client outlined (job: "from here") --- */
        tl.fromTo("#s4-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "power3.out" }, T(18.95));
        tl.fromTo("#s4-stem", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, T(19.0));
        tl.fromTo("#s4-card", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(19.15));

        /* --- the drive-time sign: the site's own component (job: proof of "3 minutes"). It grows one row at a time so it is never a box of empty rows. --- */
        var ROW = 82, H1 = 198; /* CSS height of the sign with one row; each further row adds 82 px up to 444 px */
        tl.fromTo("#s4-sign", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, T(19.1));
        tl.fromTo("#s4-sh", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(19.2));
        ["#s4-r1", "#s4-r2", "#s4-r3", "#s4-r4"].forEach(function (id, i) {
          var t = T(TL_.ev["location.row" + (i + 1)]);
          tl.fromTo(id, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
          if (i > 0) tl.fromTo("#s4-sign", { height: H1 + (i - 1) * ROW }, { height: H1 + i * ROW, duration: 0.35, ease: "power3.out", immediateRender: false }, t - 0.04);
        });
        tl.fromTo("#s4-hl", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, T(TL_.ev["location.row1"]) + 0.1);
        var cnt = { v: 0 };
        var cntEl = document.getElementById("s4-cnt");
        tl.fromTo(cnt, { v: 0 }, { v: 3, duration: 0.7, ease: "power3.out", onUpdate: function () { cntEl.textContent = Math.round(cnt.v); } }, T(TL_.ev["location.row1"]) + 0.05);

        window.__timelines["s4-location"] = tl;
      })();
