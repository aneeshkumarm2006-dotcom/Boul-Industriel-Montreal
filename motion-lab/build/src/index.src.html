<!doctype html>
<html lang="fr" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Boul-Industriel-Montréal : lancement</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f1d1e; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0f1d1e; }
      .scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      #wipe-bar { position: absolute; left: 0; top: 0; width: 8px; height: 1080px; background: #d4f0c9; box-shadow: 0 0 28px 6px rgba(212, 240, 201, 0.4); z-index: 60; opacity: 0; }
      #grain { position: absolute; left: -512px; top: -512px; width: 2944px; height: 2104px; background-image: url("assets/img/grain.png"); background-size: 512px 512px; mix-blend-mode: overlay; opacity: 0.1; pointer-events: none; z-index: 70; }
      #fade-out { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #0f1d1e; opacity: 0; z-index: 80; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="__TOTAL__">
<!--HOSTS-->
      <div id="wipe-bar"></div>
      <div id="grain"></div>
      <div id="fade-out"></div>
    </div>
    <script>
      (function () {
        var TL_ = window.TL;
        var tl = gsap.timeline({ paused: true });

        /* Seams: a mint plotter line sweeps left to right along the building's length axis and reveals the next scene behind it. */
        tl.set("#wipe-bar", { x: -8 }, 0);
        TL_.scenes.forEach(function (s) {
          if (s.transition === "wipe") {
            var t0 = s.boundary - TL_.wipe;
            tl.fromTo("#h-" + s.id, { clipPath: "inset(0px 1920px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: TL_.wipe, ease: "power3.inOut" }, t0);
            tl.set("#wipe-bar", { opacity: 1 }, t0);
            tl.fromTo("#wipe-bar", { x: -8 }, { x: 1920, duration: TL_.wipe, ease: "power3.inOut", immediateRender: false }, t0);
            tl.set("#wipe-bar", { opacity: 0 }, t0 + TL_.wipe);
          }
          if (s.transition === "dissolve") {
            /* the one accent seam: a focus-pull dissolve into the end card (calm, closing) */
            var t1 = s.start;
            tl.fromTo("#h-" + s.id, { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: TL_.dissolve, ease: "sine.inOut" }, t1);
            var prev = TL_.scenes[TL_.scenes.indexOf(s) - 1];
            tl.fromTo("#h-" + prev.id, { filter: "blur(0px)" }, { filter: "blur(9px)", duration: TL_.dissolve, ease: "sine.inOut", immediateRender: false }, t1);
          }
        });

        /* Film grain (dither): a 512 px noise tile jumps every 2 frames on a fixed seed. */
        var seed = 7;
        function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
        for (var f = 0; f < TL_.total * TL_.fps; f += 2) {
          tl.set("#grain", { x: Math.floor(rnd() * 512), y: Math.floor(rnd() * 512) }, f / TL_.fps);
        }

        /* Final scene may exit: fade to ink over the last 0.6 s. */
        tl.fromTo("#fade-out", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.in" }, TL_.total - 0.6);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
