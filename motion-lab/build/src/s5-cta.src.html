<template id="s5-cta-template">
  <div id="root" data-composition-id="s5-cta" data-width="1920" data-height="1080" data-duration="__DUR__">
    <style>
      /*COMMON_CSS*/
      #root { background: #1d3a3c; }
      #s5-glow { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse 1100px 620px at 60% 78%, #26484a 0%, rgba(38, 72, 74, 0) 100%); }
      #s5-band { position: absolute; left: 0; top: 334px; width: 1920px; height: 746px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.38) 13%, #000 36%); mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.38) 13%, #000 36%); }
      #s5-cam { position: absolute; left: 0; top: 0; width: 1730px; height: 660px; transform-origin: 0 0; }
      #s5-photo { position: absolute; left: 0; top: 0; width: 1730px; height: 660px; display: block; filter: contrast(1.05) saturate(0.95) brightness(1.02); }
      #s5-ol { position: absolute; left: 0; top: 0; width: 1730px; height: 660px; overflow: visible; }
      #s5-vig { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse 1250px 760px at 50% 62%, rgba(15,29,30,0) 62%, rgba(15,29,30,0.42) 100%); }
      #s5-foot-scrim { position: absolute; left: 0; top: 780px; width: 1920px; height: 300px; background: linear-gradient(to top, rgba(15, 29, 30, 0.88) 0%, rgba(15, 29, 30, 0.6) 45%, rgba(15, 29, 30, 0) 100%); }
      #s5-lock { position: absolute; left: 192px; top: 108px; display: flex; align-items: center; gap: 20px; }
      #s5-lock svg { width: 72px; height: 72px; display: block; }
      #s5-lock .wm { font-variation-settings: "wdth" 112; font-weight: 760; font-size: 44px; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
      #s5-lock .sub { display: block; margin-top: 8px; font-size: 22px; letter-spacing: 0.3em; color: rgba(255, 255, 255, 0.7); }
      #s5-addr { position: absolute; right: 192px; top: 104px; text-align: right; }
      #s5-addr .l1 { display: block; font-variation-settings: "wdth" 104; font-weight: 620; font-size: 42px; line-height: 1.2; letter-spacing: -0.01em; color: #fff; white-space: nowrap; }
      #s5-addr .l2 { display: block; margin-top: 2px; font-variation-settings: "wdth" 100; font-weight: 450; font-size: 32px; line-height: 1.25; color: rgba(255, 255, 255, 0.8); white-space: nowrap; }
      #s5-btn { position: absolute; left: 192px; top: 250px; opacity: 0; }
      #s5-btn .in { display: inline-flex; align-items: center; gap: 26px; height: 150px; padding: 0 54px; border-radius: 16px; background: #d4f0c9; color: #1d3a3c; }
      #s5-btn .lbl { font-variation-settings: "wdth" 108; font-weight: 720; font-size: 68px; letter-spacing: -0.025em; line-height: 1; white-space: nowrap; }
      #s5-btn svg { width: 50px; height: 50px; display: block; fill: none; stroke: #1d3a3c; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      #s5-gloss { position: absolute; left: 192px; top: 418px; font-size: 26px; letter-spacing: 0.1em; color: rgba(212, 240, 201, 0.9); }
      #s5-phone { position: absolute; left: 1030px; top: 277px; display: flex; align-items: center; gap: 22px; color: #d4f0c9; }
      #s5-phone svg { width: 58px; height: 58px; display: block; fill: none; stroke: #d4f0c9; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      #s5-phone .num { font-weight: 600; font-size: 84px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
      #s5-team { position: absolute; left: 1030px; top: 400px; font-size: 32px; font-variation-settings: "wdth" 100; font-weight: 450; color: rgba(255, 255, 255, 0.82); white-space: nowrap; }
      #s5-foot { position: absolute; left: 192px; top: 1000px; width: 1536px; font-size: 20px; letter-spacing: 0.02em; line-height: 1.3; color: rgba(255, 255, 255, 0.8); white-space: nowrap; }
    </style>

    <div id="s5-glow"></div>
    <div id="s5-band">
      <div id="s5-cam" data-layout-allow-overflow>
        <img id="s5-photo" src="assets/img/hero-aerial.jpg" alt="" />
        <svg id="s5-ol" viewBox="0 0 1730 660" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path id="s5-shade" d="M0 0H1730V660H0Z M489 485 L714 555 L809 505 L809 477 L1247 257 L1249 214 L1107 196 L598 389 L584 385 L482 422Z" fill-rule="evenodd" fill="#0f1d1e" fill-opacity="0" />
          <polygon id="s5-fill" points="489,485 714,555 809,505 809,477 1247,257 1249,214 1107,196 598,389 584,385 482,422" fill="#d4f0c9" fill-opacity="0" />
          <polygon id="s5-stroke" points="489,485 714,555 809,505 809,477 1247,257 1249,214 1107,196 598,389 584,385 482,422" pathLength="1" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-dasharray="1 1" stroke-dashoffset="1" />
          <polygon id="s5-glint" points="489,485 714,555 809,505 809,477 1247,257 1249,214 1107,196 598,389 584,385 482,422" pathLength="1" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="0.07 0.93" stroke-dashoffset="0" opacity="0" />
        </svg>
      </div>
    </div>
    <div id="s5-vig"></div>
    <div id="s5-foot-scrim"></div>

    <div id="s5-lock">{{LOGO_GLYPH}}<div><div class="wm">Boul-Industriel</div><span class="sub t-eyebrow">Montréal</span></div></div>
    <div id="s5-addr"><span class="l1">12650–12702, boulevard Industriel</span><span class="l2">Pointe-aux-Trembles, Montréal (Québec) H1A 3V2</span></div>

    <div id="s5-btn"><div class="in" id="s5-btn-in"><span class="lbl" id="s5-lbl">Recevoir les prix</span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h11M9 3.5 13.5 8 9 12.5" /></svg></div></div>
    <div id="s5-gloss" class="t-eyebrow">Get pricing</div>

    <div id="s5-phone"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.2 1.8H3.4c-.9 0-1.6.7-1.5 1.6.5 5.6 5 10.1 10.6 10.6.9.1 1.6-.6 1.6-1.5v-1.8l-2.6-1.2-1.6 1.2a8 8 0 0 1-3.3-3.3l1.2-1.6-1.2-2.6Z" /></svg><span class="num t-mono">514 736-0511</span></div>
    <div id="s5-team">Équipe des ventes</div>

    <div id="s5-foot" class="t-mono">Disponibilités au 8 septembre 2026 · Superficies et plans à titre indicatif, sujets à changement sans préavis.</div>

    <script>
      (function () {
        var TL_ = window.TL;
        var H = TL_.hosts.cta;
        var T = function (abs) { return abs - H.start; };
        var tl = gsap.timeline({ paused: true });
        var HIT = T(TL_.ev["cta.hit"]);

        /* --- the hook's framing returns as a slow pull-back (job: callback; the film closes where it opened) --- */
        var S0 = 1.155, S1 = 1.12, PX = 900, PY = 319, FX = 999.2, FY = 364.08;
        tl.fromTo("#s5-cam",
          { x: FX - PX * S0 - 20, y: FY - PY * S0, scale: S0 },
          { x: FX - PX * S1, y: FY - PY * S1, scale: S1, duration: H.dur, ease: "sine.inOut" }, 0);

        /* --- the building draws itself once more, closing exactly on the hit (job: proof the promise is the same building) --- */
        tl.fromTo("#s5-stroke", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.4, ease: "power3.inOut" }, HIT - 1.4);
        tl.fromTo("#s5-shade", { fillOpacity: 0 }, { fillOpacity: 0.42, duration: 0.9, ease: "power2.out" }, HIT - 1.0);
        tl.fromTo("#s5-fill", { fillOpacity: 0 }, { fillOpacity: 0.16, duration: 0.8, ease: "power2.out" }, HIT - 0.7);
        tl.fromTo("#s5-fill", { fillOpacity: 0.16 }, { fillOpacity: 0.36, duration: 0.18, ease: "power2.out", immediateRender: false }, HIT);
        tl.to("#s5-fill", { fillOpacity: 0.24, duration: 0.7, ease: "power2.out" }, HIT + 0.18);
        tl.fromTo("#s5-glint", { opacity: 1, strokeDashoffset: 0 }, { strokeDashoffset: -1, duration: 1.8, ease: "power1.inOut", immediateRender: false }, HIT + 1.3);
        tl.to("#s5-glint", { opacity: 0, duration: 0.15 }, HIT + 3.1);

        /* --- brand and address arrive with the dissolve (job: who and where) --- */
        tl.fromTo("#s5-lock", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.45);
        tl.fromTo("#s5-addr", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);

        /* --- hero hit 2 on the bar-9 downbeat: the action lands (job: how to act) --- */
        tl.set("#s5-btn", { opacity: 1 }, HIT + 0.02);
        tl.fromTo("#s5-btn", { clipPath: "inset(0px 100% 0px 0px round 16px)" }, { clipPath: "inset(0px 0% 0px 0px round 16px)", duration: 0.6, ease: "expo.out" }, HIT);
        tl.fromTo("#s5-btn-in", { scale: 0.96, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.7, ease: "expo.out" }, HIT);
        tl.fromTo("#s5-phone", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, HIT + 0.2);
        tl.fromTo("#s5-gloss", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, HIT + 0.35);
        tl.fromTo("#s5-team", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, HIT + 0.5);
        tl.fromTo("#s5-foot", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power2.out" }, HIT + 0.9);

        window.__timelines["s5-cta"] = tl;
      })();
    </script>
  </div>
</template>
