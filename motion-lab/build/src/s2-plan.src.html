<template id="s2-plan-template">
  <div id="root" data-composition-id="s2-plan" data-width="1920" data-height="1080" data-duration="__DUR__">
    <style>
      /*COMMON_CSS*/
      #root { background: #1d3a3c; }
      #s2-glow { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: radial-gradient(ellipse 1250px 620px at 50% 50%, rgba(49, 87, 89, 0.55) 0%, rgba(49, 87, 89, 0) 100%); }
      #s2-head { position: absolute; left: 192px; top: 108px; width: 1536px; height: 190px; }
      #s2-head .eb { position: absolute; left: 0; top: 0; font-size: 26px; color: rgba(212, 240, 201, 0.85); }
      #s2-head .h { position: absolute; left: 0; top: 56px; font-size: 96px; color: #fff; }
      #s2-plan-wrap { position: absolute; left: 192px; top: 322px; width: 1536px; height: 386px; }
      #pl-svg { display: block; overflow: visible; }
      #pl-svg .pl-anno { font-family: "Overpass Mono", ui-monospace, monospace; font-weight: 500; font-size: 6.6px; letter-spacing: 0.1em; text-transform: uppercase; }
      #pl-svg .pl-dimtext { font-size: 6.6px; }
      #pl-svg .pl-code { font-family: "Overpass Mono", ui-monospace, monospace; font-size: 5px; font-variant-numeric: tabular-nums; }
      #pl-svg .pl-civic { font-family: "Archivo", sans-serif; font-variation-settings: "wdth" 125; font-weight: 800; font-size: 8.6px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums lining-nums; }
      #pl-svg .pl-plus { font-family: "Overpass Mono", monospace; font-weight: 600; font-size: 6px; }
      #s2-plates { position: absolute; left: 192px; top: 776px; width: 1536px; height: 172px; }
      .plate { position: absolute; top: 0; width: 264px; height: 172px; padding: 20px 24px 18px; border-radius: 14px; background: #26484a; box-shadow: inset 0 0 0 1.5px rgba(212, 240, 201, 0.22); display: flex; flex-direction: column; justify-content: space-between; }
      .plate.wide { width: 360px; }
      .plate .civic { font-size: 58px; color: #d4f0c9; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
      .plate .civic .plus { font-family: "Overpass Mono", monospace; font-weight: 500; font-size: 24px; letter-spacing: 0; color: rgba(212, 240, 201, 0.85); }
      .plate .area { font-size: 32px; color: rgba(255, 255, 255, 0.88); white-space: nowrap; }
      .plate .area small { font-size: 0.8em; }
      #s2-legend { position: absolute; left: 192px; top: 730px; display: flex; align-items: center; gap: 16px; font-size: 26px; color: rgba(212, 240, 201, 0.9); }
      #s2-legend .sw { display: block; width: 34px; height: 20px; border-radius: 3px; background: #d4f0c9; }
    </style>

    <div id="s2-glow"></div>

    <div id="s2-head">
      <div class="eb t-eyebrow" id="s2-eb" data-layout-allow-overlap>Plan du bâtiment</div>
      <div class="h t-h2"><span class="mask" style="font-size:96px"><span class="ln" id="s2-h" style="opacity:0" data-layout-allow-overflow>Choisissez votre unité.</span></span></div>
    </div>

    <div id="s2-plan-wrap">
<!--PLAN_SVG-->
    </div>

    <div id="s2-legend" class="t-eyebrow"><span class="sw"></span><span id="s2-legend-t">À vendre · De 1&nbsp;252 à 2&nbsp;509 pi²</span></div>

    <div id="s2-plates">
      <div class="plate" id="s2-p1" style="left:0px"><div class="civic t-civic">12660</div><div class="area t-mono">1&nbsp;776 <small>pi²</small></div></div>
      <div class="plate" id="s2-p2" style="left:288px"><div class="civic t-civic">12658</div><div class="area t-mono">1&nbsp;780 <small>pi²</small></div></div>
      <div class="plate" id="s2-p3" style="left:576px"><div class="civic t-civic">12656</div><div class="area t-mono">1&nbsp;252 <small>pi²</small></div></div>
      <div class="plate" id="s2-p4" style="left:864px"><div class="civic t-civic">12696</div><div class="area t-mono">1&nbsp;259 <small>pi²</small></div></div>
      <div class="plate wide" id="s2-p5" style="left:1152px"><div class="civic t-civic">12652<span class="plus">+12700</span></div><div class="area t-mono">2&nbsp;509 <small>pi²</small></div></div>
    </div>

    <div class="bug" id="s2-bug" data-layout-allow-overlap>{{LOGO_GLYPH}}<span class="bug-word" data-layout-allow-overlap>Boul-Industriel</span></div>

    <script>
      (function () {
        var TL_ = window.TL;
        var H = TL_.hosts.plan;
        var T = function (abs) { return abs - H.start; };
        var tl = gsap.timeline({ paused: true });
        var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
        function segLen(el) {
          var x1 = +el.getAttribute("x1"), y1 = +el.getAttribute("y1"), x2 = +el.getAttribute("x2"), y2 = +el.getAttribute("y2");
          return Math.hypot(x2 - x1, y2 - y1);
        }
        /* Local times (seconds after the wipe starts). The choreography starts under the wipe so the seam reveals a scene already drawing itself. */

        /* --- heading (job: name the action) --- */
        tl.set("#s2-h", { opacity: 1 }, 0.1);
        tl.fromTo("#s2-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        tl.fromTo("#s2-h", { yPercent: 150 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0.1);

        /* --- the plan draws in the site's own drafting language (job: proof of scale, 24 units in one building) --- */
        /* dash pattern = L on, L+4 off, start offset L+2: nothing (not even a square cap) is visible before the draw begins */
        var lines = $$("#pl-svg .pl-draw");
        lines.forEach(function (el) { var L = segLen(el); el.style.strokeDasharray = L + " " + (L + 4); });
        var hide = function (i, el) { return segLen(el) + 2; };
        var walls = $$("#pl-walls .pl-draw");
        var parts = $$("#pl-partitions .pl-draw");
        var dims = $$("#pl-dim-len .pl-draw, #pl-dim-dep .pl-draw");
        tl.fromTo(dims, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.55, ease: "power3.inOut", stagger: 0.05 }, 0.15);
        tl.fromTo("#pl-dim-len .pl-dimline line:not(.pl-draw), #pl-dim-dep .pl-dimline line:not(.pl-draw), .pl-dimbox, .pl-dimtext", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.55);
        tl.fromTo("#pl-boulevard", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
        tl.fromTo(walls, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.4, ease: "power3.inOut", stagger: { amount: 0.8 } }, 0.15);
        tl.fromTo(parts, { strokeDashoffset: hide }, { strokeDashoffset: 0, duration: 0.35, ease: "power3.inOut", stagger: { amount: 0.6 } }, 0.35);
        tl.fromTo(".pl-door", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out", stagger: { amount: 0.4 } }, 0.55);
        tl.fromTo("#pl-service .pl-hatch", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75);
        /* unit codes (including the five that will light: their "off" state) fade in with the drawing, then hold; the light-up tweens below never render early */
        tl.fromTo("#pl-labels .pl-code", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: { amount: 0.5 } }, 0.7);

        /* --- five units light on the eighth notes of bar 4 (job: which five, the mint "for sale" callback) --- */
        var order = ["12660", "12658", "12656", "12696", "12700"];
        order.forEach(function (id, i) {
          var t = T(TL_.ev["plan.hit" + (i + 1)]);
          tl.fromTo("#pl-fill-" + id, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo("#pl-off-" + id, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo("#pl-on-" + id, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t + 0.05);
          tl.fromTo("#s2-p" + (i + 1), { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, t);
        });
        tl.fromTo(".pl-saleoutline", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, T(TL_.ev["plan.hit1"]));
        tl.fromTo("#s2-legend", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T(TL_.ev["plan.hit1"]) - 0.2);

        /* --- ambient: the plan breathes 1.2 % through the hold so nothing freezes --- */
        tl.fromTo("#s2-plan-wrap", { scale: 1 }, { scale: 1.012, duration: H.dur - 0.6, ease: "sine.inOut", transformOrigin: "50% 50%" }, 0.3);

        window.__timelines["s2-plan"] = tl;
      })();
    </script>
  </div>
</template>
