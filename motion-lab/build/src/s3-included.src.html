<template id="s3-included-template">
  <div id="root" data-composition-id="s3-included" data-width="1920" data-height="1080" data-duration="__DUR__">
    <style>
      /*COMMON_CSS*/
      #root { background: #f3f5f2; color: #0f1d1e; }
      #s3-card { position: absolute; left: 192px; top: 132px; width: 700px; height: 808px; border-radius: 28px; background: #ffffff; box-shadow: 0 34px 60px -34px rgba(15, 29, 30, 0.38), inset 0 0 0 1.5px #cbd5d1; }
      #s3-card .draw { position: absolute; left: 40px; top: 36px; width: 620px; height: 671px; }
      #s3-card .cap { position: absolute; left: 40px; right: 40px; bottom: 30px; padding-top: 18px; border-top: 1.5px solid #cbd5d1; font-size: 24px; color: #0f1d1e; }
      #un-svg { display: block; overflow: visible; }
      #un-svg .mono { font-family: "Overpass Mono", ui-monospace, monospace; }
      #un-svg .uppercase { text-transform: uppercase; }
      #s3-col { position: absolute; left: 960px; top: 132px; width: 768px; height: 808px; }
      #s3-col .eb { position: absolute; left: 0; top: 0; font-size: 26px; color: #56666a; }
      #s3-col .h { position: absolute; left: 0; top: 62px; font-size: 76px; color: #0f1d1e; }
      #s3-col .row { position: absolute; left: 0; width: 768px; height: 120px; display: flex; align-items: center; gap: 24px; }
      #s3-col .num { flex: 0 0 auto; width: 72px; height: 72px; border-radius: 50%; background: #dfe6e2; color: #56666a; display: grid; place-items: center; font-family: "Overpass Mono", monospace; font-weight: 700; font-size: 34px; line-height: 1; }
      #s3-col .ti { display: block; font-size: 44px; color: #0f1d1e; white-space: nowrap; }
      #s3-col .ch { display: block; margin-top: 8px; font-size: 28px; letter-spacing: 0.08em; color: #56666a; white-space: nowrap; }
      .bug.ink .bug-word { color: #0f1d1e; }
    </style>

    <div id="s3-card">
      <div class="draw" id="s3-draw">
<!--UNIT_SVG-->
      </div>
      <div class="cap t-eyebrow" id="s3-cap">Unité type, vue en plan</div>
    </div>

    <div id="s3-col">
      <div class="eb t-eyebrow" id="s3-eb">Dans chaque unité</div>
      <div class="h t-h2">
        <span class="mask"><span class="ln" id="s3-h1" style="opacity:0" data-layout-allow-overflow>Un atelier complet,</span></span>
        <span class="mask"><span class="ln" id="s3-h2" style="opacity:0" data-layout-allow-overflow>pas une simple</span></span>
        <span class="mask"><span class="ln" id="s3-h3" style="opacity:0" data-layout-allow-overflow>coquille vide.</span></span>
      </div>
      <div class="row" id="s3-r1" style="top:384px"><div class="num" id="s3-n1">1</div><div class="tx t-h3"><span class="ti">Porte de garage 10′ × 12′</span></div></div>
      <div class="row" id="s3-r2" style="top:524px"><div class="num" id="s3-n2">2</div><div class="tx t-h3"><span class="ti">Entrée électrique indépendante</span><span class="ch t-eyebrow">110 V · 220 V · 550 V</span></div></div>
      <div class="row" id="s3-r3" style="top:664px"><div class="num" id="s3-n3">3</div><div class="tx t-h3"><span class="ti">Salle de bain et chauffe-eau</span><span class="ch t-eyebrow">15 gallons</span></div></div>
    </div>

    <div class="bug ink" id="s3-bug">{{LOGO_GLYPH}}<span class="bug-word" data-layout-allow-overlap>Boul-Industriel</span></div>

    <script>
      (function () {
        var TL_ = window.TL;
        var H = TL_.hosts.included;
        var T = function (abs) { return abs - H.start; };
        var tl = gsap.timeline({ paused: true });
        var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

        /* Local times (seconds after the wipe starts at 11.5 s). Everything starts under the wipe, so the seam reveals a scene that is already assembling itself. */

        /* --- card and headline (job: reframe from "building" to "one shop") --- */
        tl.fromTo("#s3-card", { y: 44, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo("#s3-eb", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
        ["#s3-h1", "#s3-h2", "#s3-h3"].forEach(function (id, i) {
          tl.set(id, { opacity: 1 }, 0.15 + i * 0.1);
          tl.fromTo(id, { yPercent: 150 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, 0.15 + i * 0.1);
        });
        tl.fromTo("#s3-cap", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.45);

        /* --- the unit drawing draws itself: walls grow from their start edge (job: proof, show what "complete" means) --- */
        tl.fromTo("#un-slab-rect", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.15);
        tl.fromTo("#un-walls .wh", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.55, ease: "power3.inOut", stagger: { amount: 0.5 } }, 0.2);
        tl.fromTo("#un-walls .wv", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.55, ease: "power3.inOut", stagger: { amount: 0.3 } }, 0.3);
        tl.fromTo("#un-window, #un-door-leaf, #un-wc-door", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.8);
        tl.fromTo("#un-door-arc", { strokeDasharray: 4.72, strokeDashoffset: 4.72 }, { strokeDashoffset: 0, duration: 0.5, ease: "power3.inOut" }, 0.9);
        tl.fromTo("#un-wc-arc", { strokeDasharray: 3.93, strokeDashoffset: 3.93 }, { strokeDashoffset: 0, duration: 0.5, ease: "power3.inOut" }, 1.0);
        tl.fromTo("#un-garage-panel", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 1.0);
        tl.fromTo("#un-garage-track", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.25);
        tl.fromTo("#un-washroom, #un-heater, #un-panel", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 1.25);
        tl.fromTo("#un-open", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 1.55);

        /* --- three proofs, one per 1.33 s (2 beats), each pinned to its part of the drawing --- */
        var items = [
          { row: "#s3-r1", num: "#s3-n1", marker: "#un-m1", hl: "#un-garage-hl", dim: true },
          { row: "#s3-r2", num: "#s3-n2", marker: "#un-m2", hl: "#un-panel-hl" },
          { row: "#s3-r3", num: "#s3-n3", marker: "#un-m3", hl: "#un-wash-hl" },
        ];
        /* the list is on screen early (a silent film needs reading time); the badges then light in sequence, each pinned to its part of the drawing */
        items.forEach(function (it, i) {
          tl.fromTo(it.row, { x: -34, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.65 + i * 0.14);
        });
        items.forEach(function (it, i) {
          var t = T(TL_.ev["included.item" + (i + 1)]);
          tl.fromTo(it.num, { backgroundColor: "#dfe6e2", color: "#56666a" }, { backgroundColor: "#1d3a3c", color: "#d4f0c9", duration: 0.25, ease: "power2.out", immediateRender: false }, t);
          tl.fromTo(it.num, { scale: 1.3 }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t);
          tl.fromTo(it.marker, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, t);
          tl.fromTo(it.hl, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          if (i < items.length - 1) tl.to(it.hl, { opacity: 0, duration: 0.4, ease: "power2.in" }, T(TL_.ev["included.item" + (i + 2)]) - 0.05);
        });
        tl.fromTo("#un-dim, #un-dim-text", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T(TL_.ev["included.item1"]));

        /* --- ambient, linear so it never slows to a stop inside a hold: the card drifts 1.2 % and the drawing inside it pushes in 3.5 % (job: the breather must not read as a freeze in a silent film) --- */
        tl.fromTo("#s3-card", { scale: 1 }, { scale: 1.012, duration: H.dur - 0.6, ease: "none", transformOrigin: "50% 50%", immediateRender: false }, 0.6);
        tl.fromTo("#s3-draw", { scale: 1 }, { scale: 1.035, duration: H.dur - 0.6, ease: "none", transformOrigin: "50% 70%", immediateRender: false }, 0.6);

        window.__timelines["s3-included"] = tl;
      })();
    </script>
  </div>
</template>
